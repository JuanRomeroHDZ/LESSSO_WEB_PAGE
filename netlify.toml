# Configuración de Netlify para LESSSO
[build]
  publish = "."
  functions = "netlify/functions"

# Ruta limpia para suscripciones: lessso.com/suscripciones -> suscripciones.html
[[redirects]]
  from = "/suscripciones"
  to = "/suscripciones.html"
  status = 200

# Headers de seguridad de nivel profesional para ciberseguridad y alto rendimiento
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self 'https://*.stripe.com' 'https://buy.stripe.com' 'https://checkout.stripe.com')"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "upgrade-insecure-requests; default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.googletagmanager.com https://*.stripe.com https://buy.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://lessso.com https://www.lessso.com https://*.netlify.app /.netlify/functions/contacto;"
